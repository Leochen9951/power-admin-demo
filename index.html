<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="stylesheet" href="./app.css" />
  <script src="./js/static-api.js"></script>
</head>
<body>

    <symbol id="i-meter" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/><path d="M7.5 4.7A9 9 0 0 1 12 3"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 6h18"/><path d="M7 22l-4-4 4-4"/><path d="M21 18H3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></symbol>
    <symbol id="i-bill" viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 0 1 1 1v18l-3-2-3 2-3-2-3 2V3a1 1 0 0 1 1-1Z"/><path d="M9 7h6M9 11h6M9 15h4"/></symbol>
    <symbol id="i-pay" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>

    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z"/></symbol>

</svg>

<div id="login" class="login-screen" hidden>
  <div class="login-art">
    <div class="login-brand"><span class="logo-mark"><svg><use href="#i-bolt"/></svg></span> 智电云</div>
    <h1>让每一度电<br/>都有迹可循</h1>
    <p>物联网电表接入 · 户表档案 · 分段计量 · 自动出账 · 线上缴费</p>
    <div class="login-stats">
      <div><b>60</b><span>接入用户</span></div>
      <div><b>13</b><span>账期数据</span></div>
      <div><b>2.5w</b><span>抄表记录</span></div>
    </div>
    <div class="login-glow"></div>
  </div>
  <div class="login-panel">
    <form id="loginForm" class="login-form" autocomplete="off">
      <h2>登录管理后台</h2>
      <p class="muted">使用管理员账号进入系统</p>
      <label class="field"><span>账号</span><input id="username" value="admin" /></label>
      <label class="field"><span>密码</span><input id="password" type="password" value="admin123" /></label>
      <button class="btn primary block" type="submit">登 录</button>
      <p class="login-hint">演示账号 <code>admin</code> / <code>admin123</code></p>
      <a class="login-link" href="./pay.html">用户缴费入口 →</a>
    </form>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="logo-mark"><svg><use href="#i-bolt"/></svg></span>
      <div><b>智电云</b><span>POWER OPS</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <a class="pay-link" href="./pay.html" target="_blank">
        <svg><use href="#i-pay"/></svg><span>用户缴费端</span><i>↗</i>
      </a>
      <div class="user-chip">
        <span class="avatar" id="avatar">管</span>
        <div><b id="userName">管理员</b><span id="userRole">系统管理员</span></div>
        <button class="icon-btn" id="logoutBtn" title="退出登录"><svg><use href="#i-logout"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <span class="live-dot" title="物联网网关在线"></span>
        <span class="top-note" id="topNote">数据截止 —</span>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
