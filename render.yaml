# Render 蓝图：一键部署完整版演示
# 用法：Render 控制台 → New → Blueprint → 选择本仓库
#
# 默认 free：不用绑卡，15 分钟无访问会休眠，容器磁盘是临时的（重启后演示数据重置）。
# 想要「常驻 + 数据不丢」：把 plan 改成 starter（约 $7/月），取消下面 disk 段的注释。
services:
  - type: web
    name: power-admin-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /api/healthz
    envVars:
      - key: TZ
        value: Asia/Shanghai
      - key: DEMO_FRESH
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false          # 部署时在控制台填写，不要提交到仓库
    # disk:
    #   name: power-data
    #   mountPath: /app/data
    #   sizeGB: 1
